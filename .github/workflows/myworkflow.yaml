name: myworkflow1
on:
  push:
    branches:
      - shivanibranch
  workflow_dispatch:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
           cat /etc/os-release
           cd 
           ls -al
           docker --version
           docker compose version
      - name: mystep2- clone the repo
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al
      - name: mystep4-build docker image
        run: docker image build -t shivanipanwar/shivaniimage_nov2:t1 -f Dockerfile .
      - name: mystep5-check the docker image
        uses: docker images
        with: 
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: &{{ secrets.DOCKERHUB_TOKEN }}
      - name: mystep7-push the docker image
         run: docker image push shivanipanwar/shivaniimage_nov2:t1
      - name: mystep8       

